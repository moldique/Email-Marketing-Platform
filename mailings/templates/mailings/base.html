<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Email Marketing Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #f8f9fa;
        }
        
        .navbar {
            background-color: #8b0000 !important;
        }
        
        .container {
            background-color: #2c0a0a;
            border-radius: 5px;
            padding: 1rem;
        }
        
        .btn-primary {
            background-color: #8b0000;
            border-color: #8b0000;
        }
        
        .table {
            background-color: #2c0a0a;
            color: #f8f9fa;
        }
        
        .table thead th {
            background-color: #8b0000;
            color: #f8f9fa;
        }
        
        .form-control {
            background-color: #2c0a0a;
            border-color: #8b0000;
            color: #f8f9fa;
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.25rem;
        }
        
        .form-control:focus {
            background-color: #2c0a0a;
            border-color: #8b0000;
            color: #f8f9fa;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(139, 0, 0, 0.25);
        }
        
        .form-label {
            color: #f8f9fa;
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Email Marketing</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'recipient_list' %}">Получатели</a>
                <a class="nav-link" href="{% url 'message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing_list' %}">Рассылки</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
