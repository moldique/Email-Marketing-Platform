{% extends 'mailings/base.html' %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<h1>Удалить рассылку</h1>
<p>Вы уверены, что хотите удалить рассылку "{{ mailing.message.subject }}" ({{ mailing.get_status_display }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
