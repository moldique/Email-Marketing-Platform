{% extends 'mailings/base.html' %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<h1>Сообщения</h1>
<a href="{% url 'message_create' %}" class="btn btn-primary">Добавить сообщение</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Тема письма</th>
            <th>Тело письма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
            <tr>
                <td>{{ message.subject }}</td>
                <td>{{ message.body|truncatewords:10 }}</td>
                <td>
                    <a href="{% url 'message_update' message.pk %}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                    <a href="{% url 'message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
