{% extends 'mailings/base.html' %}

{% block title %}Удалить получателя{% endblock %}

{% block content %}
    <h1>Удалить получателя</h1>
    <p>Вы уверены, что хотите удалить получателя "{{ recipient.full_name }}" ({{ recipient.email }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
