{% extends 'mailings/base.html' %}

{% block title %}Добавить получателя{% endblock %}

{% block content %}
<h1>Добавить получателя</h1>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_email" class="form-label">Email</label>
        {{ form.email }}
    </div>
    <div class="mb-3">
        <label for="id_full_name" class="form-label">Ф. И. О.</label>
        {{ form.full_name }}
    </div>
    <div class="mb-3">
        <label for="id_comment" class="form-label">Комментарий</label>
        {{ form.comment }}
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
